<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rituale — Area riservata</title><style>body{margin:0;background:#11111d;color:#edf0f5;font:16px Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:46px 22px}.login{max-width:360px;margin:15vh auto;background:#202033;padding:32px;border-radius:16px}.logo{color:#47b9ff;font-weight:bold;letter-spacing:.1em;text-transform:uppercase}h1{font:400 38px Georgia,serif}input,textarea,select{width:100%;box-sizing:border-box;margin:7px 0 16px;padding:12px;background:#171725;color:white;border:1px solid #3a3a51;border-radius:7px}button{background:#20a4ed;color:#08111e;border:0;padding:12px 18px;font-weight:bold;border-radius:7px;cursor:pointer}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,form{background:#202033;padding:20px;border-radius:12px}.card b{font-size:30px;display:block;margin-top:9px;color:#fff}.forms{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}@media(max-width:700px){.cards,.forms{grid-template-columns:1fr}}</style><body><main class="shell"><section id="login" class="login"><div class="logo">rituale.</div><h1>Area riservata</h1><input id="password" type="password" placeholder="Password"><button id="enter">Accedi</button><p id="error"></p></section><section id="app" class="hidden"><div class="logo">rituale. / dashboard</div><h1>Panoramica</h1><div class="cards"><div class="card">Click coupon<b id="clicks">—</b></div><div class="card">Vendite<b id="sales">—</b></div><div class="card">Commissioni<b id="commissions">—</b></div><div class="card">Articoli pubblicati<b id="articles">—</b></div></div><div class="forms"><form id="coupon"><h2>Nuovo coupon</h2><input name="brand" placeholder="Brand" required><input name="code" placeholder="Codice" required><input name="discount" placeholder="Es. 15% di sconto" required><input name="affiliate_url" placeholder="Link affiliato"><textarea name="description" placeholder="Descrizione"></textarea><button>Salva coupon</button></form><form id="article"><h2>Nuovo articolo</h2><input name="title" placeholder="Titolo" required><select name="category"><option>Yoga</option><option>Pilates</option><option>Activewear</option><option>Wellness</option></select><textarea name="meta_description" placeholder="Meta descrizione (max 160)" required></textarea><textarea name="content" placeholder="Testo dell'articolo" required></textarea><button>Pubblica articolo</button></form></div></section></main><script>const q=s=>document.querySelector(s);async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error);return d}async function dashboard(){let d=await api('/api/admin/dashboard');q('#clicks').textContent=d.clicks;q('#sales').textContent=d.salesCount;q('#commissions').textContent='€ '+d.commissions.toFixed(2);q('#articles').textContent=d.publishedArticles;q('#login').classList.add('hidden');q('#app').classList.remove('hidden')}q('#enter').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:q('#password').value})});dashboard()}catch(e){q('#error').textContent=e.message}};['coupon','article'].forEach(id=>q('#'+id).onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(id==='coupon')data.categories=['wellness'];try{await api('/api/admin/'+(id==='coupon'?'offers':'articles'),{method:'POST',body:JSON.stringify(data)});e.target.reset();dashboard();alert('Salvato.')}catch(x){alert(x.message)}});</script></body></html>
