<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rituale Journal</title><style>body{margin:0;background:#f7f2e8;color:#153b35;font:17px/1.7 Arial}.wrap{width:min(760px,90%);margin:50px auto}a{color:#153b35}img{width:100%;max-height:420px;object-fit:cover}h1{font:48px/1.05 Georgia,serif}.tag{letter-spacing:.12em;text-transform:uppercase;font-size:12px}article{white-space:pre-wrap}</style><main class="wrap"><a href="/">← Torna a Rituale</a><p class="tag" id="category"></p><h1 id="title">Caricamento…</h1><img id="image" alt=""><article id="content"></article></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/public/articles').then(r=>r.json()).then(items=>{const a=items.find(x=>String(x.id)===id);if(!a)throw 0;document.title=a.title+' — Rituale';category.textContent=a.category;title.textContent=a.title;image.src=a.image_url;image.alt=a.title;content.textContent=a.content||a.excerpt}).catch(()=>{title.textContent='Articolo non trovato';content.textContent='Torna alla home per vedere gli articoli disponibili.'})</script></html>
